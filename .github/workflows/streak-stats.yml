name: Update Streak Stats

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&date_format=M%20j%5B%2C%20Y%5D&timezone=Asia%2FKolkata
          path: profile/streak.svg

      - name: Generate Accurate GitHub Stats Card
        run: python scripts/generate_stats.py
        env:
          STREAK_STATS_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit streak and stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/stats.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "Update streak and stats [skip ci]"
          git push
